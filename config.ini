# cpp-nn-visualizer default configuration.
# Comments start with '#'. Section headers in [brackets] are ignored —
# keys are flat. Values are read at startup; restart to apply changes.

window.width = 1280
window.height = 800
window.title = cpp-nn-visualizer
# When true, the app launches in borderless-windowed fullscreen. F11 toggles
# at runtime regardless of this setting.
window.fullscreen = false

# Position the visualizer opens with. Any valid 6-field FEN.
default.fen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1

# Asset directories. Paths are relative to the working directory.
assets.pieces = assets/pieces

# Board square palette. "red" restores the warm cream/rose board design.
# Other built-in values: neural, classic, blue, green.
board.palette = red

# Startup activation panel: nnue, cnn, bt4, classical, or off. The same setting
# can still be changed at runtime with the architecture buttons or the A key.
startup.arch = cnn

# MCTS search-tree workbench. Press G to open the full-window search tree; Start
# runs a PUCT search driven by the currently selected architecture. startup.tree
# boots straight into it; mcts.visits is the default playout budget. mcts.cpuct
# is the PUCT exploration constant.
startup.tree = false
mcts.visits  = 20000
mcts.cpuct   = 2.8

# UI fonts. If a path is missing or fails to load, raylib's built-in raster
# font is used as a fallback. ui_size / mono_size set the atlas resolution
# (in px); pick something larger than the largest text size you'll render to
# avoid blurry upscaling.
fonts.ui        = /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
fonts.mono      = /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
fonts.ui_size   = 40
fonts.mono_size = 40

# Model file paths.
model.nnue    = models/nnue-halfkp-demo.bin
model.lc0_cnn = models/lc0-cnn-small-112p-4x32-policy4672-wdl3.bin
model.lc0_bt4 = models/lc0-bt4-tiny-96x4x4h.bin

# Optional chess clock. Disabled by default; when enabled, both sides start
# with initial_seconds and the mover receives increment_seconds after each
# completed move. A zero clock displays a time-loss banner.
clock.enabled = false
clock.initial_seconds = 300
clock.increment_seconds = 0
